teleop_twist_joy:
  ros__parameters:
    require_enable_button: true
    enable_button: 4        # LB button

    axis_linear:
      x: 1                  # left stick vertical
    scale_linear:
      x: 0.5                # m/s

    axis_angular:
      z: 0                  # left stick horizontal
    scale_angular:
      z: 1.0                # rad/s

    publish_stamped_twist: true
