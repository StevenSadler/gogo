[env:uno]
platform = atmelavr
board = uno
framework = arduino
extra_scripts = 
    extra_pre.py     ; runs before build
    extra_post.py    ; runs after build
lib_deps = https://github.com/basicmicro/roboclaw_arduino_library.git
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 38400
